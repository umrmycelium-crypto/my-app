apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rule-engine.fullname" . }}
  labels:
    {{- include "rule-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rule-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rule-engine.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rule-engine.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: rule-engine
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: POSTGRES_CONN
          valueFrom:
            secretKeyRef:
              name: vision-secrets
              key: postgres-conn
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: vision-secrets
              key: redis-host
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        - name: LOG_LEVEL
          value: "{{ .Values.logLevel }}"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
